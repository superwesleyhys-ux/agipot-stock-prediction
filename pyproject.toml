[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agipot-stock-prediction"
version = "0.1.0"
description = "Transparent stock research: multi-horizon analysis, factor scoring and online edge models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "superwesleyhys-ux"}]
dependencies = ["exchange-calendars>=4.13,<5", "pandas>=2.2,<4", "tzdata>=2025.1"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
agipot-predict = "agipot_stock_prediction.cli:main"

[project.urls]
Repository = "https://github.com/superwesleyhys-ux/agipot-stock-prediction"
Issues = "https://github.com/superwesleyhys-ux/agipot-stock-prediction/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
