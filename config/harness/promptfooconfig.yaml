# Fixed synthetic evidence snapshots. Change expected judgments only after reviewing the evidence contract.
description: 'Offline original-evidence regression: supplied annotations, no LLM or external APIs'
prompts:
- '{{payload}}'
providers:
- id: file://../../src/agipot_stock_prediction/integrations/promptfoo.py
  label: agipot-evidence-trace-local
evaluateOptions:
  maxConcurrency: 1
defaultTest:
  vars:
    expectedContent: MIXED_SUPPORTED_AND_REFUTED
