limitations":["Stable entity IDs, relation annotations and verdicts require independently established ground truth.","Origin IDs and exact text hashes deduplicate known syndication; unknown paraphrases may remain correlated.","No evidence means UNKNOWN; keyword co-occurrence and display summaries do not establish a relation."],"schema":"evidence-trace/1"}
  assert:
  - type: is-json
  - type: javascript
    value: |-
      const result = JSON.parse(output);
      return result.content_verdict === context.vars.expectedContent && result.automatic_truth_inference === false;
  - type: javascript
    value: |-
      const result = JSON.parse(output);
      return JSON.stringify(result.claims.map(claim => claim.verdict)) === context.vars.expectedVerdicts;
  - type: javascript
    value: |-
      const result = JSON.parse(output);
      delete result.display_summary;
      return JSON.stringify(result) === JSON.stringify(JSON.parse(context.vars.expectedJudgment));
