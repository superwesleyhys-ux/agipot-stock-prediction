repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: quick-properties
        name: Formula contract properties
        entry: python -m pytest tests/test_formula_properties.py -q
        language: system
        pass_filenames: false
        types: [python]
