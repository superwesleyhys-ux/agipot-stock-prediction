name: Harness checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install uv nox
      - run: nox -s tests-${{ matrix.python }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv nox
      - run: nox -s lint types properties distribution audit benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-evidence
          path: |
            reports/
            dist/
  optional-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --locked --extra harness --extra integrations
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/test_integrations.py -q
